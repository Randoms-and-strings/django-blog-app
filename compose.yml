services:
  db:
    image: postgres:18-alpine
    container_name: postgres_container
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: testing-db
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - "5432:5432"
    volumes:
      - djangoblog_data:/var/lib/postgresql
    env_file:
      - path: ./.env
        required: true

  djangoblog:
    container_name: django_container
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
#    command: >
#      sh -c "python manage.py makemigrations &&
#             python manage.py migrate &&
#             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_started
      elasticsearch:
        condition: service_started
    volumes:
      - .:/blog-app

  nginx:
    container_name: nginx_django_webserver_docker
    build:
      context: .
      dockerfile: Dockerfile Webserver
#    volumes:
#      - ./templates:/etc/nginx/templates
    ports:
      - "8080:80"
    depends_on:
      djangoblog:
        condition: service_started


  elasticsearch:
    container_name: ES
    image: elasticsearch:9.2.0
    ports:
      - "9200:${ELASTIC_PORT}"
    environment:
      discovery.type: 'single-node'
      xpack.security.enabled: 'true'
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
#      ES_JAVA_OPTS: '-Xmx2g -Xms2g
    env_file:
      - path: ./.env
    mem_limit: 1g

    volumes:
      - C:/Users/ASUS/Downloads/elasticsearch-9.2.0-windows-x86_64/elasticsearch-9.2.0/config/elasticsearch.yml:\
       /usr/share/elasticsearch/config/elasticsearch.yml
      - elastic_data:/usr/share/elasticsearch/data
      - elastic_users:/usr/share/elasticsearch/users
      - elastic_users_roles:/usr/share/elasticsearch/users_roles
      - C:/Users/ASUS/Downloads/elasticsearch-9.2.0-windows-x86_64/elasticsearch-9.2.0/config/roles.yml:\
       /usr/share/elasticsearch/config/roles.yml






