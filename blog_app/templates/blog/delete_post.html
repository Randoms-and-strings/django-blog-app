{% extends "blog/base.html" %}

{% block content %}
 <main class="container">
    <div class="delete-box text-center">
      <h2 class="fw-bold text-danger mb-3">Delete Post</h2>
      <p class="mb-4">
        Are you sure you want to delete this post?<br>
        <strong class="text-dark">"{{the_post.title}}"</strong>
      </p>

      <div class="d-flex justify-content-center gap-3">
        <!-- Confirm button -->
        <form method="post">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger px-4">Yes, Delete</button>
        </form>

        <!-- Cancel button -->
        <a href="{% url 'postdetail_page' the_post.id %}" class="btn btn-secondary px-4">Cancel</a>
      </div>
    </div>
  </main>
{% endblock %}
